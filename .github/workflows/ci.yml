name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Uji aturan game (murni KMP, tercepat & paling penting).
      - name: Test core (JVM)
        run: ./gradlew :core-domain:jvmTest :core-data:jvmTest :core-assets:jvmTest --stacktrace

      # Pastikan seluruh modul ter-compile.
      - name: Assemble JVM
        run: ./gradlew :app:assemble --stacktrace

      - name: Build Web (JS)
        run: ./gradlew :app:jsBrowserProductionWebpack --stacktrace

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: app/build/dist/js/productionExecutable
          if-no-files-found: ignore
